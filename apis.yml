aid: evertrue
name: EverTrue
description: 'EverTrue is a donor experience and fundraising platform for nonprofit,
  higher-education, and healthcare advancement teams, serving more than 13,000 teams.
  Its product suite spans AI-driven prospect identification and research (Signal,
  DonorSearch), donor outreach and stewardship (ThankView personalized video, Pledgemine
  direct mail), and endowment reporting (Balance, Impact, ODDER). EverTrue integrates
  with advancement CRMs such as Blackbaud Raiser''s Edge NXT via an automated data
  sync. EverTrue operates as a closed B2B SaaS: it runs internal REST APIs behind
  its iOS, Android, and single-page web applications but does not publish a public
  developer portal, OpenAPI specification, or self-serve API program. Backed by Bain
  Capital Ventures and Techstars.'
